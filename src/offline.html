<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Club Crumbs — Offline</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #16181C; color: #e2e2e2;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      text-align: center; max-width: 360px; padding: 28px;
      background: #1e2126; border: 1px solid #2c3036; border-radius: 12px;
    }
    h1 { font-size: 18px; margin: 0 0 8px; letter-spacing: .04em; }
    p { font-size: 13px; color: #9aa0a8; line-height: 1.5; margin: 0 0 20px; }
    button {
      background: #007AFF; color: #fff; border: 0; border-radius: 8px;
      padding: 10px 20px; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    button:hover { opacity: .9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CLUB CRUMBS</h1>
    <p>You're offline, or the site can't be reached right now. Check your connection and try again.</p>
    <button id="retry">Retry</button>
  </div>
  <script>
    const target = new URLSearchParams(location.search).get('url');
    document.getElementById('retry').addEventListener('click', () => { if (target) location.href = target; });
    window.addEventListener('online', () => { if (target) location.href = target; });
  </script>
</body>
</html>
